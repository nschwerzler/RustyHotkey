name: Public repository checks
on: [push, pull_request]
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_public.py --all
      - run: python -B -m unittest discover -s tools -p 'test_*.py'
  windows-x64:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rhk-build
      PYTHONPATH: python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup default stable
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: python -B -m unittest discover -s python/tests
